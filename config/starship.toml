# Minimal, fast single-line prompt (robbyrussell-inspired)
# Explicit format avoids probing dozens of unused language/cloud modules.
"$schema" = "https://starship.rs/config-schema.json"

add_newline = false
command_timeout = 500

format = "$directory$git_branch$git_status$nodejs$python$ruby$cmd_duration$character"

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"
vimcmd_symbol = "[❮](bold green)"

[directory]
style = "bold cyan"
truncation_length = 3
truncate_to_repo = true

[git_branch]
format = '[git:\(](bold blue)[$branch](bold red)[\)](bold blue) '

[git_status]
format = "([$all_status$ahead_behind]($style) )"
style = "bold yellow"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[nodejs]
symbol = "node:"
format = "[$symbol($version)]($style) "
style = "dimmed green"
detect_extensions = []

[python]
symbol = "py:"
format = "[$symbol($version)]($style) "
style = "dimmed yellow"
detect_extensions = []

[ruby]
symbol = "rb:"
format = "[$symbol($version)]($style) "
style = "dimmed red"
detect_extensions = []

[cmd_duration]
min_time = 2_000
format = "[$duration]($style) "
style = "dimmed yellow"
